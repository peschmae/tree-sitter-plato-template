name: Build, test, and package parser
on: [push, pull_request]

jobs:
    parser:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-24.04
                      platform: linux
                      arch: amd64
                      extension: so
                    - runner: ubuntu-24.04-arm
                      platform: linux
                      arch: arm64
                      extension: so
                    - runner: macos-15-intel
                      platform: macos
                      arch: amd64
                      extension: dylib
                    - runner: macos-15
                      platform: macos
                      arch: arm64
                      extension: dylib
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.16.0'
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.24.6'
            - run: npm ci
            - name: Check grammar formatting
              if: matrix.runner == 'ubuntu-24.04'
              run: npm exec -- prettier --check '*.js'
            - run: npm run build
            - name: Verify checked-in generated parser
              run: git diff --exit-code -- src/grammar.json src/node-types.json src/parser.c
            - run: npm test
            - name: Build and verify native artifact
              run: sh scripts/package-parser.sh
            - uses: actions/upload-artifact@v4
              with:
                  name: tree-sitter-plato-${{ matrix.platform }}-${{ matrix.arch }}
                  path: |
                      dist/tree-sitter-plato-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
                      dist/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 14
